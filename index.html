<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Boa noite</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #7ec8ff, #b3e5ff);
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .principal {
            font-size: 34px;
            font-weight: bold;
            color: #ffffff;
            animation: pulse 2s infinite;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.25);
            z-index: 2;
        }

        .sub {
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255,255,255,0.95);
            z-index: 2;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .stitch {
            position: absolute;
            width: 50px;
            animation: float 8s linear infinite;
            opacity: 0.9;
            z-index: 1;
        }

        @keyframes float {
            0% {
                transform: translateY(110vh);
                opacity: 0;
            }
            10% { opacity: 1; }
            100% {
                transform: translateY(-20vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="principal">
        Boa noite nenê 💙<br>
        Beijos no bumbum 😘
    </div>

    <div class="sub">
        ala destruidora de fones kkkkk
    </div>

    <script>
        function criarStitch() {
            const stitch = document.createElement("img");
            stitch.classList.add("stitch");
            stitch.src = "https://i.imgur.com/6XbKQ9k.png"; // Stitch fofo
            stitch.style.left = Math.random() * 100 + "vw";
            stitch.style.width = (Math.random() * 30 + 40) + "px";
            stitch.style.animationDuration = (Math.random() * 4 + 6) + "s";

            document.body.appendChild(stitch);

            setTimeout(() => {
                stitch.remove();
            }, 9000);
        }

        setInterval(criarStitch, 700);
    </script>

</body>
</html>
